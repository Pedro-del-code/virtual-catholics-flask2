<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Catholics</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--gold:#c9a84c;--gold-light:#e8d5a3;--gold-soft:#d4b96a;--cream:#f5f0e8;--dark:#080808}
  body{background:var(--dark);color:var(--cream);font-family:'EB Garamond',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  #particles-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
  .logo{width:min(300px,75vw);opacity:0;transform:scale(0.72);filter:drop-shadow(0 0 50px rgba(201,168,76,.35));animation:logoIn 1.8s cubic-bezier(.16,1,.3,1) .4s forwards}
  @keyframes logoIn{to{opacity:1;transform:scale(1)}}
  .title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.3rem,5vw,2rem);color:var(--gold-light);letter-spacing:.15em;opacity:0;margin-top:-14px;animation:up 1s ease 1.9s forwards;text-shadow:0 0 40px rgba(201,168,76,.25)}
  .sub{font-family:'EB Garamond',serif;font-style:italic;font-size:clamp(.8rem,2.5vw,1rem);color:rgba(229,220,200,.45);letter-spacing:.3em;text-transform:uppercase;opacity:0;margin-top:8px;animation:up 1s ease 2.3s forwards}
  .divider{width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;margin:24px 0;animation:up 1s ease 2.6s forwards}
  .actions{display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;animation:up 1s ease 2.9s forwards}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .btn-primary{background:linear-gradient(135deg,#b8932a,#d4aa50,#b8932a);background-size:200%;color:#0a0800;font-family:'Cinzel',serif;font-size:.85rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:14px 40px;border:none;cursor:pointer;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);transition:all .3s;box-shadow:0 4px 20px rgba(201,168,76,.25);text-decoration:none;display:inline-block}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,168,76,.4)}
  .btn-ghost{background:transparent;color:var(--gold-soft);font-family:'Cinzel',serif;font-size:.78rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:12px 32px;border:1px solid rgba(201,168,76,.35);cursor:pointer;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);transition:all .3s;text-decoration:none;display:inline-block}
  .btn-ghost:hover{background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.6);color:var(--gold-light)}
</style>
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="wrap">
  <img class="logo" src="/static/logo.png" alt="Virtual Catholics">
  <h1 class="title">Virtual Catholics</h1>
  <p class="sub">Sua jornada espiritual começa aqui</p>
  <div class="divider"></div>
  <div class="actions">
    <a class="btn-primary" href="/login">Entrar na Comunidade</a>
    <a class="btn-ghost" href="/register">Criar Conta</a>
  </div>
</div>
<script type="module" src="/static/main.js"></script>
</body>
</html>
