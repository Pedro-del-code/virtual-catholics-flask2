<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Catholics — Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--gold:#c9a84c;--gold-light:#e8d5a3;--gold-soft:#d4b96a;--cream:#f5f0e8;--dark:#080808;--card:#0e0e0e}
  body{background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.06) 0%,transparent 60%),var(--dark);color:var(--cream);font-family:'EB Garamond',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
  #particles-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
  .card{position:relative;z-index:1;background:var(--card);border:1px solid rgba(201,168,76,.15);padding:40px 36px;width:min(420px,100%);box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(201,168,76,.1);animation:cardIn .6s cubic-bezier(.16,1,.3,1) forwards}
  .card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .logo{width:56px;display:block;margin:0 auto 14px;filter:drop-shadow(0 0 12px rgba(201,168,76,.3))}
  .title{font-family:'Cinzel Decorative',serif;font-size:1.2rem;color:var(--gold-light);text-align:center;margin-bottom:4px}
  .sub{font-family:'EB Garamond',serif;font-style:italic;font-size:.88rem;color:rgba(229,220,200,.4);text-align:center;letter-spacing:.15em;margin-bottom:24px}
  .tabs{display:flex;border-bottom:1px solid rgba(201,168,76,.15);margin-bottom:24px}
  .tab{flex:1;background:transparent;border:none;color:rgba(229,220,200,.35);font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;padding:10px 0;cursor:pointer;position:relative;transition:color .3s}
  .tab.active{color:var(--gold-soft)}
  .tab.active::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:1px;background:var(--gold)}
  .fields{display:flex;flex-direction:column;gap:13px;margin-bottom:16px}
  .field{position:relative}
  .field label{display:block;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,168,76,.6);margin-bottom:5px}
  .field input{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.18);border-bottom:1px solid rgba(201,168,76,.35);color:var(--cream);font-family:'EB Garamond',serif;font-size:1rem;padding:11px 14px;outline:none;transition:all .3s;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%)}
  .field input::placeholder{color:rgba(229,220,200,.2)}
  .field input:focus{border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.04)}
  .eye{position:absolute;right:12px;bottom:11px;color:rgba(201,168,76,.35);cursor:pointer;font-size:.9rem;user-select:none}
  .forgot{text-align:right;margin-bottom:12px}
  .forgot a{font-family:'EB Garamond',serif;font-style:italic;font-size:.82rem;color:rgba(201,168,76,.45);text-decoration:none;cursor:pointer;transition:color .3s}
  .forgot a:hover{color:var(--gold-soft)}
  .btn-primary{background:linear-gradient(135deg,#b8932a,#d4aa50,#b8932a);background-size:200%;color:#0a0800;font-family:'Cinzel',serif;font-size:.82rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:13px;border:none;cursor:pointer;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);transition:all .3s;box-shadow:0 4px 20px rgba(201,168,76,.25);width:100%;margin-top:4px}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,168,76,.4)}
  .or{display:flex;align-items:center;gap:12px;margin:16px 0;color:rgba(229,220,200,.25);font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.2em}
  .or::before,.or::after{content:'';flex:1;height:1px;background:rgba(201,168,76,.15)}
  .btn-google{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:rgba(245,240,232,.85);font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.1em;padding:12px 24px;cursor:pointer;width:100%;justify-content:center;transition:all .3s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%)}
  .btn-google:hover{background:rgba(255,255,255,.08)}
  .btn-google svg{width:18px;height:18px;flex-shrink:0}
  .panel{display:none}.panel.active{display:block}
  .small-link{font-family:'EB Garamond',serif;font-style:italic;font-size:.82rem;color:rgba(229,220,200,.3);cursor:pointer;background:none;border:none;transition:color .3s;text-decoration:underline;text-underline-offset:3px;display:block;text-align:center;margin-top:16px}
  .small-link:hover{color:var(--gold-soft)}
  .back{display:block;text-align:center;margin-top:18px;font-family:'EB Garamond',serif;font-style:italic;font-size:.82rem;color:rgba(229,220,200,.22);text-decoration:none;transition:color .3s}
  .back:hover{color:rgba(229,220,200,.5)}
  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(14,14,14,.96);border:1px solid rgba(201,168,76,.3);color:var(--gold-light);font-family:'EB Garamond',serif;font-size:.9rem;padding:11px 22px;white-space:nowrap;z-index:999;transition:transform .4s cubic-bezier(.16,1,.3,1);box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.error{border-color:rgba(200,80,80,.4);color:#e8a0a0}
</style>
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div id="toast"></div>
<div class="card">
  <a href="/"><img class="logo" src="/static/logo.png" alt="VC"></a>
  <h2 class="title">Virtual Catholics</h2>
  <p class="sub">In Nomine Patris</p>

  <div class="tabs">
    <button class="tab {% if tab == 'login' %}active{% endif %}" onclick="switchTab('login')">Entrar</button>
    <button class="tab {% if tab == 'register' %}active{% endif %}" onclick="switchTab('register')">Criar Conta</button>
  </div>

  <!-- LOGIN -->
  <div id="panel-login" class="panel {% if tab == 'login' %}active{% endif %}">
    <div class="fields">
      <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="email@exemplo.com"></div>
      <div class="field"><label>Senha</label><input type="password" id="login-pass" placeholder="••••••••"><span class="eye" onclick="togglePass('login-pass',this)">👁</span></div>
    </div>
    <div class="forgot"><a href="/reset">Esqueci minha senha</a></div>
    <button class="btn-primary" onclick="handleLogin()">Entrar</button>
    <div class="or">ou</div>
    <button class="btn-google" onclick="handleGoogle()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continuar com Google
    </button>
  </div>

  <!-- REGISTRO -->
  <div id="panel-register" class="panel {% if tab == 'register' %}active{% endif %}">
    <div class="fields">
      <div class="field"><label>Nome de Usuário</label><input type="text" id="reg-username" placeholder="seu_nome_aqui"></div>
      <div class="field"><label>E-mail</label><input type="email" id="reg-email" placeholder="email@exemplo.com"></div>
      <div class="field"><label>Senha</label><input type="password" id="reg-pass" placeholder="mínimo 8 caracteres"><span class="eye" onclick="togglePass('reg-pass',this)">👁</span></div>
      <div class="field"><label>Confirmar Senha</label><input type="password" id="reg-pass2" placeholder="repita a senha"><span class="eye" onclick="togglePass('reg-pass2',this)">👁</span></div>
    </div>
    <button class="btn-primary" onclick="handleRegister()">Criar Conta</button>
    <div class="or">ou</div>
    <button class="btn-google" onclick="handleGoogle()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continuar com Google
    </button>
    <button class="small-link" onclick="switchTab('login')">Já tenho conta → Entrar</button>
  </div>

  <a class="back" href="/">← Voltar ao início</a>
</div>
<script type="module" src="/static/main.js"></script>
</body>
</html>
