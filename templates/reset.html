<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Catholics — Redefinir Senha</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--gold:#c9a84c;--gold-light:#e8d5a3;--gold-soft:#d4b96a;--cream:#f5f0e8;--dark:#080808;--card:#0e0e0e}
  body{background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.06) 0%,transparent 60%),var(--dark);color:var(--cream);font-family:'EB Garamond',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #particles-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
  .card{position:relative;z-index:1;background:var(--card);border:1px solid rgba(201,168,76,.15);padding:40px 36px;width:min(420px,100%);box-shadow:0 20px 60px rgba(0,0,0,.7);animation:cardIn .6s cubic-bezier(.16,1,.3,1) forwards}
  .card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .back{display:flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(201,168,76,.45);text-decoration:none;margin-bottom:26px;transition:color .3s}
  .back:hover{color:var(--gold-soft)}
  .icon{font-size:2.6rem;text-align:center;margin-bottom:12px}
  .title{font-family:'Cinzel Decorative',serif;font-size:1.15rem;color:var(--gold-light);text-align:center;margin-bottom:10px}
  .msg{font-family:'EB Garamond',serif;font-style:italic;font-size:.95rem;color:rgba(229,220,200,.45);text-align:center;line-height:1.7;margin-bottom:24px}
  .field{position:relative;margin-bottom:20px}
  .field label{display:block;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,168,76,.6);margin-bottom:5px}
  .field input{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.18);border-bottom:1px solid rgba(201,168,76,.35);color:var(--cream);font-family:'EB Garamond',serif;font-size:1rem;padding:11px 14px;outline:none;transition:all .3s;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%)}
  .field input::placeholder{color:rgba(229,220,200,.2)}
  .field input:focus{border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.04)}
  .btn-primary{background:linear-gradient(135deg,#b8932a,#d4aa50,#b8932a);background-size:200%;color:#0a0800;font-family:'Cinzel',serif;font-size:.82rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:13px;border:none;cursor:pointer;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);transition:all .3s;box-shadow:0 4px 20px rgba(201,168,76,.25);width:100%}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,168,76,.4)}
  .small-link{font-family:'EB Garamond',serif;font-style:italic;font-size:.82rem;color:rgba(229,220,200,.3);cursor:pointer;background:none;border:none;text-decoration:underline;text-underline-offset:3px;display:block;text-align:center;margin-top:16px;transition:color .3s}
  .small-link:hover{color:var(--gold-soft)}
  #success{display:none;text-align:center}
  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(14,14,14,.96);border:1px solid rgba(201,168,76,.3);color:var(--gold-light);font-family:'EB Garamond',serif;font-size:.9rem;padding:11px 22px;white-space:nowrap;z-index:999;transition:transform .4s cubic-bezier(.16,1,.3,1)}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.error{border-color:rgba(200,80,80,.4);color:#e8a0a0}
</style>
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div id="toast"></div>
<div class="card">
  <a class="back" href="/login">← Voltar ao login</a>
  <div id="form-state">
    <div class="icon">✉️</div>
    <h2 class="title">Redefinir Senha</h2>
    <p class="msg">Informe seu e-mail e enviaremos<br>um link para redefinir sua senha.</p>
    <div class="field">
      <label>E-mail cadastrado</label>
      <input type="email" id="reset-email" placeholder="email@exemplo.com">
    </div>
    <button class="btn-primary" onclick="handleReset()">Enviar Link</button>
    <button class="small-link" onclick="window.location.href='/login'">Lembrei minha senha</button>
  </div>
  <div id="success-state" style="display:none;text-align:center">
    <div class="icon">✅</div>
    <p class="msg" style="margin-bottom:24px">Link enviado! Verifique sua caixa<br>de entrada e siga as instruções.</p>
    <a class="btn-primary" style="text-decoration:none;display:inline-block" href="/login">Voltar ao Login</a>
  </div>
</div>
<script type="module" src="/static/main.js"></script>
</body>
</html>
