<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Catholics</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--gold:#c9a84c;--gold-light:#e8d5a3;--gold-soft:#d4b96a;--cream:#f5f0e8;--dark:#080808}
  body{background:var(--dark);color:var(--cream);font-family:'EB Garamond',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  .logo{width:76px;filter:drop-shadow(0 0 20px rgba(201,168,76,.3))}
  .title{font-family:'Cinzel Decorative',serif;font-size:1.4rem;color:var(--gold-light)}
  .welcome{font-family:'EB Garamond',serif;font-style:italic;font-size:1.1rem;color:rgba(229,220,200,.5);letter-spacing:.1em}
  .divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .label{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.2em;color:rgba(229,220,200,.25);text-transform:uppercase}
  .btn-ghost{background:transparent;color:var(--gold-soft);font-family:'Cinzel',serif;font-size:.75rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:12px 32px;border:1px solid rgba(201,168,76,.35);cursor:pointer;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);transition:all .3s;text-decoration:none;display:inline-block}
  .btn-ghost:hover{background:rgba(201,168,76,.08);color:var(--gold-light)}
</style>
</head>
<body>
  <img class="logo" src="/static/logo.png" alt="VC">
  <h1 class="title">Virtual Catholics</h1>
  <p class="welcome">Bem-vindo, {{ user.name }} ✝</p>
  <div class="divider"></div>
  <p class="label">Dashboard em construção</p>
  <a class="btn-ghost" href="/logout">Sair</a>
</body>
</html>
